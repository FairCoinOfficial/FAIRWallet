name: Build Android APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach APK to (optional)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: bun test src modules

      # `app.json` points Android's `googleServicesFile` at a gitignored
      # `google-services.json` (FCM push), so a clean checkout cannot prebuild.
      # A release needs the real file, from the `GOOGLE_SERVICES_JSON` secret,
      # and fails here without it rather than shipping an APK that never
      # receives a push. A manual run with no release tag is a build check: it
      # falls back to the committed template, and its APK has no working push.
      - name: Provide google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          IS_RELEASE: ${{ github.event_name == 'release' || github.event.inputs.release_tag != '' }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
          elif [ "$IS_RELEASE" = "true" ]; then
            echo "::error::A release build needs the GOOGLE_SERVICES_JSON secret (docs/notifications-infra.md)."
            exit 1
          else
            echo "::warning::No GOOGLE_SERVICES_JSON secret: building with the template; push notifications will not work in this APK."
            cp google-services.json.example google-services.json
          fi

      - name: Prebuild Android project
        run: bunx expo prebuild --platform android --clean

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Dorg.gradle.jvmargs="-Xmx4g" \
            -Dorg.gradle.parallel=true

      - name: Collect and rename APKs
        # `release_tag` is attacker-controllable workflow_dispatch input: pass it
        # through the environment instead of interpolating it into the script.
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          VERSION="${GITHUB_REF_NAME:-${RELEASE_TAG:-dev}}"
          mkdir -p apk-output
          for apk in $(find android/app/build/outputs/apk/release -name "*.apk"); do
            filename=$(basename "$apk")
            cp "$apk" "apk-output/FAIRWallet-${VERSION}.apk"
          done
          echo "=== Built APKs ==="
          ls -lh apk-output/

      - name: Upload APKs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: FAIRWallet-APK
          path: apk-output/*.apk
          retention-days: 90

      - name: Attach APKs to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: apk-output/*.apk

      - name: Attach APKs to Release (manual trigger)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          files: apk-output/*.apk
